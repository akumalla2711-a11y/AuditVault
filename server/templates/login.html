{% extends "base.html" %}

{% block title %}AuditVault — Login{% endblock %}

{% block body %}
<div class="login-container">
    <div class="login-card glass">

        <!-- Branding -->
        <div class="login-logo">
            <div class="login-logo-icon">🛡️</div>
            <h1>AuditVault</h1>
        </div>
        <p class="login-subtitle">Remote System Audit Dashboard</p>

        <!-- Error message -->
        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}

        <!-- Login form -->
        <form method="POST" action="{{ url_for('login_page') }}" id="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text"
                       id="username"
                       name="username"
                       class="form-input"
                       placeholder="Enter your username"
                       autocomplete="username"
                       required
                       autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password"
                       id="password"
                       name="password"
                       class="form-input"
                       placeholder="Enter your password"
                       autocomplete="current-password"
                       required>
            </div>

            <button type="submit" class="btn btn-primary" id="login-button">
                Sign In
            </button>
        </form>

        <p class="login-subtitle mt-2" style="margin-bottom: 0; font-size: 0.75rem;">
            Secured with session-based authentication
        </p>
    </div>
</div>
{% endblock %}
